# Uncomment the following lines to enable the cygnus RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the cygnus OLED Display
# CONFIG_ZMK_DISPLAY=y

# Battery
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

# Bluetooth
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y


# Name
CONFIG_ZMK_KEYBOARD_NAME="TBK Mini"
